; ============================================================================
; SmurfHunter.ini - SPOKE version
; ----------------------------------------------------------------------------
; Deploy on: every other server in the fleet (each of the 4 non-hub servers)
; Save as:   <user-dir>/System/SmurfHunter.ini   (same folder as UT2004.ini)
;
; Spokes dial the hub OUTBOUND only - no inbound firewall changes needed,
; works on locked-down hosting. A spoke with NO SmurfDB.ini will self-seed:
; it connects empty, pulls the hub's full DB, and creates its local ini in
; one bulk write (do NOT copy SmurfDB.ini here - let it self-seed).
;
; The spoke also does its own local capture (v1 behavior) and pushes new
; records up to the hub, which relays them to all other spokes.
;
; CentralHost is the hub IP or DNS name, NO game port - the :7798 in the
; hub's game address is irrelevant; sync always uses CentralPort (TCP 9075).
;
; CentralHost below uses a documentation address (203.0.113.10) - replace
; it with your own hub's IP or DNS name.
;
; NOTE: full-line ';' comments are documentation only - the engine rewrites
; this file on config saves (comments will vanish) and anything after '=' on
; a value line becomes part of the value. Never add inline ';' comments.
; ============================================================================

[SmurfHunter.MutSmurfHunter]
bCentralHub=False
CentralHost=203.0.113.10
CentralPort=9075
CentralToken=<your fleet token - byte-identical to the hub's>

