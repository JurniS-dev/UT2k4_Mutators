; ============================================================================
; SmurfHunter.ini - HUB version
; ----------------------------------------------------------------------------
; Deploy on: your fleet's hub server
; Save as:   <user-dir>/System/SmurfHunter.ini   (e.g. ~/.ut2004/System/ on Linux,
;            or Documents/My Games/UT2004/UT2004/System/ per-hosting-panel on
;            Windows-hosted servers - the same folder your server's UT2004.ini
;            lives in)
;
; The hub also does its own local capture (v1 behavior) in addition to
; serving the fleet. If you pre-seed a SmurfDB.ini, deploy it to the HUB
; first - every spoke self-seeds from it on first sync.
;
; Firewall: open TCP 9075 INBOUND on this box (tighten to the spoke IPs once
; you've harvested them from the hub log lines "link authenticated from <ip>").
; ============================================================================

[SmurfHunter.MutSmurfHunter]
bCentralHub=True
; CentralHost is unused in hub mode (the hub listens, it doesn't dial).
; Leave it empty. A hub MAY also act as a spoke of another hub (set
; CentralHost+CentralToken to fan out) - not used in this fleet.
CentralHost=
CentralPort=9075
CentralToken=<your fleet token - long random secret, byte-identical on every spoke>

; ============================================================================
; SEPARATE FILE: SmurfDB.ini goes in this same folder on the hub server.
; Only the hub needs the seeded file - every spoke self-seeds from it
; via first sync. Generated by Tools/csv_to_smurfdb.py, section looks like:
;
;   [SmurfHunter.SmurfDB]
;   Records=(Hash=...,Aliases=...,FirstSeen=...)
;
; ============================================================================
;
; NOTE ON COMMENTS: full-line ';' comments are shown here for documentation.
; The engine ignores lines that match no setting, but it REWRITES this file on
; config saves - don't expect comments to survive on a live server. And never
; put a ';' comment on the same line as a value: everything after '=' is the
; value, so it would break the setting.
; ============================================================================
