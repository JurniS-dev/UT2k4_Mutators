; ============================================================================
; SmurfHunter.ini - FEDERATION example (v3, hub-to-hub peering)
; ----------------------------------------------------------------------------
; A federation peer is a HUB of ANOTHER operator's fleet (or your own second
; fleet). Both sides must configure each other with the SAME pairwise token:
;
;   your entry:    FederationPeers=(Host="<their hub IP>", Port=9075, Token="<pairwise secret>")
;   their entry:   FederationPeers=(Host="<your hub IP>",  Port=9075, Token="<pairwise secret>")
;
; The SAME entry serves both directions:
;   OUTBOUND - your hub dials their listener with AUTH <token> LINKTYPE HUB
;   INBOUND  - their hub dials you; the token must match one of YOUR entries
;              AND the source IP must match that entry's Host.
;
; IMPORTANT - use DOTTED IPs for Host: the in-code source-IP check only works
; with dotted IPs (a DNS hostname degrades to token-only auth, logged).
; Belt-and-suspenders on top of the OS firewall: a stolen token alone cannot
; connect from a foreign machine.
;
; Only ONE side needs to dial out - records flow live BOTH ways over that one
; connection (the dialer's link is inbound to the listener, so relays travel
; it in both directions). If both dial each other, duplicates are harmless.
;
; Records flow: their players -> your hub -> your spokes (live), and
; vice versa. Relay fires ONLY on DB change, so mesh loops die at the first
; already-known hop. A hub down for a week catches up fully on reconnect.
;
; v3.00 ALSO ships the ignore-list safety net (put it in SmurfDB.ini, not
; here - it is DB data):
;
;   [SmurfHunter.SmurfDB]
;   IgnoredHashes=<32-hex hash>
;   IgnoredNames=WebAdmin
;
; Rejected at Register() - the single choke point for local capture AND every
; inbound source (spoke, peer hub, relay) - and scrubbed from the on-disk DB
; at startup, so a poisoned or junk record can never enter from ANY peer.
;
; NOTE: full-line ';' comments are documentation only - the engine rewrites
; this file on config saves (comments will vanish) and anything after '=' on
; a value line becomes part of the value. Never add inline ';' comments.
; ============================================================================

[SmurfHunter.MutSmurfHunter]
bCentralHub=True
CentralPort=9075
CentralToken=<your own fleet token - unchanged from v2, for YOUR spokes>

bFederate=True
FederationPeers=(Host="203.0.113.20",Port=9075,Token="<pairwise secret shared ONLY with this peer>")
FederationPeers=(Host="198.51.100.7",Port=9075,Token="<a DIFFERENT secret shared only with THIS peer>")
; ---------------------------------------------------------------------------
; v1.4.0 (internal v3.04) - Main identity:
; MainAdminPassword: gate for 'mutate smurfmainset <player name> <password>'.
;   EMPTY / absent = the command is DISABLED on this server (fail closed).
;   Compare is exact + case-sensitive; the password is never logged. The
;   password must not contain spaces (it is the last console token).
; ServerID: stable identity of THIS node, used to resolve Main conflicts
;   across the fleet. Leave EMPTY = a unique random 16-char hex ID is
;   generated ONCE and saved back to this ini on first boot. Or set a
;   readable name (letters/digits/dash, max 32) - but it must be UNIQUE:
;   never copy the same ServerID onto two servers.
MainAdminPassword=
ServerID=
