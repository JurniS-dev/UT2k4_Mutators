; ============================================================================
; SmurfDB.example.ini - example format of the SmurfHunter registry file
; ----------------------------------------------------------------------------
; SmurfHunter creates SmurfDB.ini automatically (in the server's user-dir
; System/ folder, next to UT2004.ini) on the first registered player - you
; only need a file here if you want to PRE-SEED records from an existing
; player history (Tools/csv_to_smurfdb.py builds one from a CSV).
;
; Copy as SmurfDB.ini into the server's user-dir System/ BEFORE first boot.
; Records key on the CD-key hash; aliases are a comma-joined unique list,
; oldest first. The record below is FAKE (format illustration only).
;
; v1.4.0 (internal v3.04) adds four optional fields per record - the Main
; identity (who the player IS, shown first in whois):
;   Main="..."      canonical identity; auto-seeded from the oldest alias
;   MainSet=0       revision counter - 0 = seeded/never admin-set (seeds are
;                   local only and never sync). An admin 'mutate smurfmainset'
;                   change takes rev+1 and converges across the fleet.
;   MainOrigin=""   ServerID of the node that last set Main (empty at rev 0)
;   MainStamp=""    display-only local timestamp of the last admin change
; All four may be omitted on seed records - the mutator fills them in
; (Main = oldest alias, rev 0). See the README 'Main identity' section.
;
; NOTE: full-line ';' comments are documentation only - the engine rewrites
; this file on config saves (comments will vanish). Never use inline ';'
; comments (everything after '=' becomes part of the value).
; ============================================================================

[SmurfHunter.SmurfDB]
Records=(Hash="0123456789abcdef0123456789abcdef",Aliases="ExamplePlayer,ExamplePlayerRenamed",FirstSeen="2026-11-01 12:34",Main="ExamplePlayer",MainSet=0,MainOrigin="",MainStamp="")

; Optional ignore lists - the junk/poison safety net (see README).
; For junk webadmin-proxy records use IgnoredHashes (one line per hash) -
; v3.01 excludes that proxy structurally so it can no longer be recorded
; at all. Do NOT put WebAdmin on IgnoredNames: a name match would erase
; the whole record of a REAL player who ever used that alias:
; IgnoredHashes=0123456789abcdef0123456789abcdef
